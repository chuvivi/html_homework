<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 300px;
        height: 400px;
        border: 1px solid gray;
        border-radius: 4px;
        overflow: hidden;
      }

      .card .card-img {
        width: 100%;
        height: 160px;
        position: relative;
      }

      .card .card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-title {
        font-size: 18px;
        font-weight: bold;
        padding: 8px 8px 4px;
      }

      .card-content {
        font-size: 12px;
        color: #555;
        line-height: 1.5;
        padding: 0 8px 12px;
      }

      .tag {
        position: absolute;
        top: 0;
        right: 0;

        background-color: red;
        color: white;
        padding: 10px 12px;
        border-radius: 4px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-img">
        <img src="https://picsum.photos/500/300/?random=10" />
        <div class="tag">hot</div>
      </div>
      <div class="card-title">卡片標題</div>
      <div class="card-content">
        這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容
      </div>
    </div>
  </body>
</html>
