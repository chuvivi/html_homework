<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card mx-auto" style="max-width: 900px">
        <div class="card-body p-4">
          <div class="btn-group w-100 mb-4" role="group">
            <button
              id="startBtn"
              type="button"
              class="btn btn-outline-secondary"
            >
              開始
            </button>

            <button
              id="restartBtn"
              type="button"
              class="btn btn-outline-secondary"
            >
              放棄重來
            </button>

            <button
              id="showAnswerBtn"
              type="button"
              class="btn btn-outline-secondary"
            >
              看答案
            </button>
          </div>
          <ul
            id="historyList"
            class="list-group mb-4"
            style="min-height: 280px"
          ></ul>
          <div class="input-group">
            <span class="input-group-text fw-bold">猜答案</span>

            <input
              id="guessInput"
              type="text"
              class="form-control"
              maxlength="4"
            />
            <button
              id="guessBtn"
              class="btn btn-outline-secondary"
              type="button"
            >
              猜!
            </button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      let answer = "";

      const startBtn = document.querySelector("#startBtn");
      const restartBtn = document.querySelector("#restartBtn");
      const showAnswerBtn = document.querySelector("#showAnswerBtn");
      const guessBtn = document.querySelector("#guessBtn");

      const guessInput = document.querySelector("#guessInput");
      const historyList = document.querySelector("#historyList");

      guessBtn.disabled = true;
      restartBtn.disabled = true;

      function createAnswer() {
        const numbers = [];

        while (numbers.length < 4) {
          const number = Math.floor(Math.random() * 10);

          if (!numbers.includes(number)) {
            numbers.push(number);
          }
        }

        answer = numbers.join("");

        console.log("答案是：", answer);
      }

      function isValidGuess(guess) {
        if (guess.length !== 4) {
          alert("請輸入4個數字");
          return false;
        }

        for (let i = 0; i < guess.length; i++) {
          if (isNaN(Number(guess[i]))) {
            alert("只能輸入數字");
            return false;
          }
        }

        const guessNumbers = [];

        for (let i = 0; i < guess.length; i++) {
          if (guessNumbers.includes(guess[i])) {
            alert("請輸入4個不相同的數字");
            return false;
          }

          guessNumbers.push(guess[i]);
        }

        return true;
      }

      function addHistory(guess, a, b) {
        const li = document.createElement("li");
        li.classList.add("list-group-item", "d-flex", "align-items-center");

        const badge = document.createElement("span");
        badge.classList.add("badge", "me-2");
        badge.textContent = `${a}A${b}B`;

        if (a === 4) {
          badge.classList.add("text-bg-success");
        } else {
          badge.classList.add("text-bg-danger");
        }

        const text = document.createElement("span");
        text.textContent = guess;
        text.classList.add("fs-5");

        li.append(badge, text);
        historyList.append(li);
      }

      startBtn.addEventListener("click", function () {
        createAnswer();

        historyList.innerHTML = "";
        guessInput.value = "";

        startBtn.disabled = true;
        guessBtn.disabled = false;
        restartBtn.disabled = false;
      });

      guessBtn.addEventListener("click", function () {
        const guess = guessInput.value.trim();

        if (!isValidGuess(guess)) {
          return;
        }

        let a = 0;
        let b = 0;

        for (let i = 0; i < 4; i++) {
          if (guess[i] === answer[i]) {
            a++;
          } else if (answer.includes(guess[i])) {
            b++;
          }
        }

        addHistory(guess, a, b);

        guessInput.value = "";

        if (a === 4) {
          alert("過關！！！");

          guessBtn.disabled = true;
          startBtn.disabled = false;
          restartBtn.disabled = true;
        }
      });

      showAnswerBtn.addEventListener("click", function () {
        if (answer === "") {
          alert("請先開始遊戲！");
          return;
        }

        alert(`答案是：${answer}`);
      });

      restartBtn.addEventListener("click", function () {
        createAnswer();

        guessInput.value = "";
        historyList.innerHTML = "";

        startBtn.disabled = true;
        guessBtn.disabled = false;
        restartBtn.disabled = false;

        alert("已重新開始~");
      });
    </script>
  </body>
</html>
